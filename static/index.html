<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invasão Acme · LLM Injection Lab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
<style>
  :root {
    --bg: #0f1220; --panel: #171b2e; --panel2: #1e2340; --line: #2a3055;
    --text: #e8eaf6; --muted: #8b90b5; --accent: #7c5cff; --accent2: #22d3ee;
    --me: #3b2f8f; --bot: #232947; --ok: #34d399; --bad: #f87171; --warn: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  button { font-family: inherit; }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: #0a0d18; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; letter-spacing: 1px; }
  .brand span { color: var(--accent2); }
  .tabs { display: flex; gap: 6px; margin-left: 12px; }
  .tab { padding: 6px 14px; border-radius: 8px; cursor: pointer; color: var(--muted); border: 1px solid transparent; }
  .tab.active { color: var(--text); background: var(--panel2); border-color: var(--line); }
  .progress { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--panel2); border: 1px solid var(--line); }
  .dot.done { background: var(--ok); color: #062; border-color: var(--ok); }
  .dot.cur { border-color: var(--accent); color: var(--accent); }
  .restart { background: none; border: 1px solid var(--line); color: var(--muted); padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; margin-left: 8px; }

  .tab:focus-visible, .contact:focus-visible, button:focus-visible { outline: 2px solid var(--accent2); outline-offset: -2px; }
  body.busy .contact:not(.sel), body.busy .clear, body.busy .restart { opacity: .45; cursor: wait; }
  .screen { flex: 1; display: none; min-height: 0; }
  .screen.active { display: flex; }

  /* ---------- messenger ---------- */
  .contacts { width: 300px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow-y: auto; }
  .contacts h3 { padding: 16px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .contact { display: flex; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #1d2240; align-items: center; }
  .contact:hover { background: var(--panel2); }
  .contact.sel { background: var(--panel2); border-left: 3px solid var(--accent); }
  .contact.locked { opacity: .4; cursor: not-allowed; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: var(--panel2); flex-shrink: 0; }
  .cinfo { flex: 1; min-width: 0; }
  .cname { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; }
  .cname small { color: var(--muted); font-weight: 400; font-size: 11px; }
  .clast { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0;
    background: radial-gradient(circle at 20% 20%, #161a33 0, transparent 40%), radial-gradient(circle at 80% 70%, #14213a 0, transparent 40%), var(--bg); }
  .chathead { display: flex; gap: 12px; align-items: center; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .chathead .status { font-size: 12px; color: var(--ok); }
  .chathead .defense { color: var(--muted); margin-left: 6px; }
  .chathead .clear { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--muted); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .msgs { flex: 1; overflow-y: auto; padding: 20px 8%; display: flex; flex-direction: column; gap: 8px; }
  .day { align-self: center; font-size: 11px; color: var(--muted); background: var(--panel); padding: 4px 10px; border-radius: 8px; margin: 6px 0; }
  .bubble { max-width: 65%; padding: 8px 12px 6px; border-radius: 12px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; animation: pop .15s ease-out; }
  .bubble.bot { background: var(--bot); align-self: flex-start; border-top-left-radius: 2px; }
  .bubble.me { background: var(--me); align-self: flex-end; border-top-right-radius: 2px; }
  .bubble.sys { align-self: center; background: #3a1d24; color: var(--bad); font-size: 13px; border: 1px solid #5b2a33; }
  .meta { display: block; text-align: right; font-size: 10px; color: var(--muted); margin-top: 2px; }
  .ticks { color: var(--accent2); }
  .typing { align-self: flex-start; background: var(--bot); padding: 10px 14px; border-radius: 12px; display: none; gap: 4px; }
  .typing i { width: 7px; height: 7px; background: var(--muted); border-radius: 50%; animation: blink 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s } .typing i:nth-child(3) { animation-delay: .4s }
  .typing .secs { font-size: 11px; color: var(--muted); margin-left: 6px; align-self: center; }
  @keyframes blink { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
  @keyframes pop { from { transform: scale(.95); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .composer { display: flex; gap: 10px; padding: 12px 18px; background: var(--panel); border-top: 1px solid var(--line); }
  .composer input { flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 11px 14px; border-radius: 22px; font-size: 14px; outline: none; }
  .composer input:focus { border-color: var(--accent); }
  .composer input:disabled { opacity: .5; }
  .send { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--accent); color: white; font-size: 18px; cursor: pointer; }
  .send:disabled { opacity: .5; cursor: wait; }
  .attach { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-size: 18px; cursor: pointer; display: none; }
  .attach.show { display: block; }
  .filechip { display: none; align-items: center; gap: 8px; margin: 0 18px 8px; align-self: flex-start; background: var(--panel2); border: 1px solid var(--accent); color: var(--text); padding: 6px 12px; border-radius: 16px; font-size: 13px; }
  .filechip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; }

  /* ---------- portal ---------- */
  #portal { align-items: center; justify-content: center; overflow-y: auto; padding: 24px 0; background: linear-gradient(160deg, #0b1024, #131a3a 60%, #0b1024); }
  .login { width: 360px; max-width: 92%; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 32px; box-shadow: 0 20px 60px #0008; }
  .login .logo { font-size: 26px; font-weight: 800; text-align: center; }
  .login .logo span { color: var(--accent2); }
  .login p { text-align: center; color: var(--muted); font-size: 13px; margin: 6px 0 24px; }
  .login label { font-size: 12px; color: var(--muted); display: block; margin: 12px 0 6px; }
  .login input { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 11px; border-radius: 8px; font-size: 14px; outline: none; }
  .login input:focus { border-color: var(--accent); }
  .login button { width: 100%; margin-top: 22px; padding: 12px; border: none; border-radius: 8px; background: var(--accent); color: white; font-weight: 600; font-size: 15px; cursor: pointer; }
  .login .err { color: var(--bad); font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }

  .dash { display: none; width: min(900px, 92%); }
  .granted { text-align: center; font-family: Consolas, monospace; font-size: 30px; color: var(--ok); letter-spacing: 4px; margin-bottom: 18px; text-shadow: 0 0 18px #34d39988; }
  .granted.final { color: var(--bad); text-shadow: 0 0 18px #f8717188; }
  .dhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .role { background: var(--panel2); border: 1px solid var(--line); padding: 4px 10px; border-radius: 20px; font-size: 12px; color: var(--accent2); margin-left: 8px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card small { color: var(--muted); font-size: 12px; }
  .card b { display: block; font-size: 24px; margin-top: 6px; }
  .card.lock { opacity: .35; }
  .clue { margin-top: 16px; background: #2b2410; border: 1px solid #5a4a16; color: var(--warn); padding: 12px 16px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
  .logout { background: none; border: 1px solid var(--line); color: var(--muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; }

  @media (max-width: 720px) {
    .contacts { width: 84px; } .cinfo, .contacts h3 { display: none; }
    .cards { grid-template-columns: 1fr; } .tabs .tab { padding: 6px 8px; }
    .brand { display: none; } .msgs { padding: 16px; } .bubble { max-width: 85%; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">ACME <span>// INVASÃO</span></div>
  <div class="tabs">
    <div class="tab active" data-s="messenger">💬 Mensagens</div>
    <div class="tab" data-s="portal">🔐 Portal</div>
  </div>
  <div class="progress" id="progress"></div>
</div>

<!-- ================= MESSENGER ================= -->
<div class="screen active" id="messenger">
  <div class="contacts" id="contacts"><h3>Acme Chat</h3></div>
  <div class="chat">
    <div class="chathead">
      <div class="avatar" id="headAvatar"></div>
      <div><div style="font-weight:600" id="headName"></div><div class="status">● online <span class="defense" id="headDefense"></span></div></div>
      <button class="clear" id="clear" title="Apaga a conversa e a memória do bot (espere a resposta terminar)">Limpar conversa</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="filechip" id="filechip"><span id="filename"></span><button id="unattach" title="Remover" aria-label="Remover anexo">✕</button></div>
    <div class="composer">
      <input type="file" id="fileinp" accept=".txt,text/plain" hidden>
      <button class="attach" id="attach" title="Anexar arquivo .txt" aria-label="Anexar arquivo .txt">📎</button>
      <input id="inp" placeholder="Digite uma mensagem" autocomplete="off" aria-label="Mensagem">
      <button class="send" id="send" title="Enviar" aria-label="Enviar">➤</button>
    </div>
  </div>
</div>

<!-- ================= PORTAL ================= -->
<div class="screen" id="portal">
  <div class="login" id="login">
    <div class="logo">ACME <span>Portal</span></div>
    <p>Acesso interno — somente funcionários</p>
    <label for="user">Usuário</label><input id="user" placeholder="usuário" autocomplete="off">
    <label for="pass">Senha</label><input id="pass" type="password" placeholder="••••••••">
    <button id="enter">Entrar</button>
    <div class="err" id="err"></div>
  </div>

  <div class="dash" id="dash">
    <div class="granted" id="granted">ACESSO LIBERADO</div>
    <div class="dhead">
      <div><b style="font-size:20px" id="dTitle"></b><span class="role" id="dRole"></span></div>
      <button class="logout" id="logout">Sair</button>
    </div>
    <div class="cards" id="dCards"></div>
    <div class="clue" id="dClue"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let game = null;     // last /api/state
let current = 1;     // selected contact
let busy = false;
let pendingFile = null;  // {name, text} waiting to be sent

function setFile(f) {
  pendingFile = f;
  $('filechip').style.display = f ? 'flex' : 'none';
  $('filename').textContent = f ? '📎 ' + f.name : '';
  $('fileinp').value = '';
}
$('attach').onclick = () => $('fileinp').click();
$('unattach').onclick = () => setFile(null);
$('fileinp').onchange = () => {
  const f = $('fileinp').files[0];
  if (!f) return;
  const max = game ? game.limits.file : 4000;
  // Cheap check first, so a huge file is never loaded into memory.
  if (f.size > max * 4) { alert(`Arquivo grande demais (máx. ${max} caracteres).`); setFile(null); return; }
  const r = new FileReader();
  r.onload = () => {
    if (r.result.length > max) { alert(`Arquivo grande demais: ${r.result.length} caracteres (máx. ${max}).`); setFile(null); return; }
    setFile({ name: f.name, text: r.result });
  };
  r.readAsText(f);
};

const now = () => new Date().toTimeString().slice(0, 5);

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  };
  try {
    const r = await fetch(path, opts);
    return { ok: r.ok, data: await r.json().catch(() => ({})) };
  } catch {
    return { ok: false, data: { error: 'Servidor do jogo fora do ar. Rode "python app.py" e recarregue a página.' } };
  }
}

// Make a div behave like a button for mouse AND keyboard (Tab + Enter/Space).
function clickable(el, fn) {
  el.tabIndex = 0; el.setAttribute('role', 'button');
  el.onclick = fn;
  el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } };
}

// ---------- tabs ----------
document.querySelectorAll('.tab').forEach(t => clickable(t, () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
  t.classList.add('active'); $(t.dataset.s).classList.add('active');
}));

// ---------- state ----------
let firstLoad = true;
let pollTimer = null;

async function refresh() {
  const { ok, data } = await api('/api/state');
  if (!ok) {
    if (!game) { $('msgs').replaceChildren(bubble('sys', '⚠️ ' + (data.error || 'Erro no servidor.'))); return; }
    // The server went away while a reply was pending: say so and keep trying.
    if (!busy && $('typing') && $('typing').style.display !== 'none') {
      $('secs').textContent = 'sem conexão, tentando de novo…';
      clearTimeout(pollTimer); pollTimer = setTimeout(refresh, 3000);
    }
    return;
  }
  game = data;
  $('inp').maxLength = game.limits.message;
  if (firstLoad) {  // open the furthest contact the player has reached
    firstLoad = false;
    const open = game.contacts.filter(c => c.unlocked);
    current = (open.find(c => !c.cleared) || open[open.length - 1]).number;
  }
  renderProgress(); renderContacts();
  if (!busy) renderChat();  // never wipe the chat while a reply is on its way
}

function renderProgress() {
  const p = $('progress'); p.innerHTML = '';
  let next = 1;
  while (game.cleared.includes(next) && next < game.total) next++;
  for (let n = 1; n <= game.total; n++) {
    const d = document.createElement('div');
    d.className = 'dot' + (game.cleared.includes(n) ? ' done' : n === next ? ' cur' : '');
    d.textContent = n === game.total ? '👑' : n;
    p.appendChild(d);
  }
  const b = document.createElement('button');
  b.className = 'restart'; b.textContent = 'Recomeçar';
  b.onclick = async () => {
    if (busy) return;
    if (!confirm('Apagar todo o progresso e as conversas?')) return;
    const { ok, data } = await api('/api/restart', {});
    if (!ok) { alert(data.error || 'Erro no servidor. O progresso não foi apagado.'); return; }
    current = 1; firstLoad = false; logout(); refresh();
  };
  p.appendChild(b);
}

function renderContacts() {
  const box = $('contacts');
  box.querySelectorAll('.contact').forEach(c => c.remove());
  for (const c of game.contacts) {
    const el = document.createElement('div');
    el.className = 'contact' + (c.unlocked ? '' : ' locked') + (c.number === current ? ' sel' : '');
    const last = c.log && c.log.length ? c.log[c.log.length - 1].text : c.greeting;
    const tag = c.cleared ? '✅' : c.unlocked ? '' : '🔒';
    const sub = c.unlocked ? last : 'Bloqueado';
    el.innerHTML = `<div class="avatar"></div><div class="cinfo"><div class="cname"><span></span><small></small></div><div class="clast"></div></div>`;
    el.querySelector('.avatar').textContent = c.avatar;
    el.querySelector('.cname span').textContent = c.name;
    el.querySelector('.cname small').textContent = tag;
    el.querySelector('.clast').textContent = sub;
    if (c.unlocked) clickable(el, () => { if (!busy) { current = c.number; setFile(null); renderContacts(); renderChat(); } });
    box.appendChild(el);
  }
}

function bubble(cls, text, meta) {
  const b = document.createElement('div');
  b.className = 'bubble ' + cls;
  b.textContent = text;
  if (meta) { const m = document.createElement('span'); m.className = 'meta'; m.innerHTML = meta; b.appendChild(m); }
  return b;
}

function typingEl() {
  const t = document.createElement('div'); t.className = 'typing'; t.id = 'typing';
  t.innerHTML = '<i></i><i></i><i></i><span class="secs" id="secs"></span>'; return t;
}

function renderChat() {
  const c = game.contacts.find(x => x.number === current);
  $('headAvatar').textContent = c.avatar; $('headName').textContent = c.name;
  $('headDefense').textContent = `· Fase ${c.number} (${c.level_name}) — 🛡️ ${c.defense}`;
  $('attach').classList.toggle('show', !!c.accepts_files);
  if (!c.accepts_files) setFile(null);
  const m = $('msgs'); m.innerHTML = '<div class="day">HOJE</div>';
  m.appendChild(bubble('bot', c.greeting));
  for (const e of c.log) {
    const meta = e.from === 'sys' ? '' : e.time + (e.from === 'me' ? ' <span class="ticks">✓✓</span>' : '');
    m.appendChild(bubble(e.from, e.text, meta));
  }
  m.appendChild(typingEl());
  // A reply started before a page reload is still being written: show it
  // and check again in a few seconds.
  const waiting = c.pending && !busy;
  $('typing').style.display = waiting ? 'flex' : 'none';
  $('send').disabled = waiting;
  // Files-only contacts read the attachment and nothing else.
  $('inp').disabled = waiting || !!c.files_only;
  if (c.files_only) $('inp').value = '';
  $('inp').placeholder = c.files_only ? 'Este contato só lê arquivos: use o 📎' : 'Digite uma mensagem';
  clearTimeout(pollTimer);
  if (waiting) pollTimer = setTimeout(refresh, 3000);
  m.scrollTop = m.scrollHeight;
}

// ---------- chat ----------
async function send() {
  const text = $('inp').value.trim();
  const file = pendingFile;
  if ((!text && !file) || busy) return;
  setBusy(true); $('inp').value = ''; $('inp').disabled = true; $('send').disabled = true;
  setFile(null);
  let failed = false;
  const m = $('msgs'), typing = $('typing');
  const shown = file ? '📎 ' + file.name + (text ? '\n' + text : '') : text;
  m.insertBefore(bubble('me', shown, `${now()} <span class="ticks">✓✓</span>`), typing);
  typing.style.display = 'flex'; m.scrollTop = m.scrollHeight;
  // Small CPUs take a while: show how long the bot has been "typing".
  const started = Date.now();
  const timer = setInterval(() => { $('secs').textContent = Math.round((Date.now() - started) / 1000) + 's'; }, 1000);

  try {
    const { ok, data } = await api('/api/chat', { level: current, message: text, file });
    if (ok) {
      m.insertBefore(bubble(data.blocked ? 'sys' : 'bot', data.answer, data.blocked ? '' : now()), typing);
    } else {
      failed = '⚠️ ' + (data.error || 'Erro no servidor.');
      m.insertBefore(bubble('sys', failed), typing);
    }
  } finally {
    clearInterval(timer); $('secs').textContent = ''; typing.style.display = 'none';
    m.scrollTop = m.scrollHeight;
    setBusy(false);
  }
  await refresh();  // re-render from the server: times, input state (files-only), contacts
  if (failed) {  // give the player their attack back instead of making them redo it
    // Refusals like "too long" never reach the server log, so the re-render
    // above dropped them: show the reason again unless the log already has it.
    const c = game && game.contacts.find(x => x.number === current);
    const last = c && c.log.length ? c.log[c.log.length - 1] : null;
    if (!busy && !(last && last.from === 'sys' && last.text === failed)) {
      const t = $('typing'); t.parentNode.insertBefore(bubble('sys', failed), t);
      t.parentNode.scrollTop = t.parentNode.scrollHeight;
    }
    // Even while the input waits for another tab's reply: it is re-enabled later.
    if (!(c && c.files_only)) $('inp').value = text;
    if (file) setFile(file);
  }
  if (!$('inp').disabled) $('inp').focus();
}

// While a reply is on its way, other chat actions wait; show it instead of
// silently ignoring clicks.
function setBusy(on) {
  busy = on;
  document.body.classList.toggle('busy', on);
}
$('send').onclick = send;
$('inp').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) send(); };
$('clear').onclick = async () => {
  if (busy) return;
  const { ok, data } = await api('/api/reset', { level: current });
  if (!ok) { alert(data.error || 'Erro no servidor. A conversa não foi apagada.'); return; }
  refresh();
};

// ---------- portal ----------
async function doLogin() {
  if (!$('user').value.trim() || !$('pass').value) { $('err').textContent = 'Preencha usuário e senha.'; return; }
  const { ok, data } = await api('/api/login', { username: $('user').value, password: $('pass').value });
  if (!ok) {
    // Wrong logins always come with a message; no message means the server failed.
    $('err').textContent = data.error || 'Erro no servidor. Tente de novo.';
    const l = $('login'); l.classList.remove('shake'); void l.offsetWidth; l.classList.add('shake');
    return;
  }
  const d = data.dashboard;
  $('granted').textContent = data.final ? 'SYSTEM COMPROMISED' : 'ACESSO LIBERADO';
  $('granted').classList.toggle('final', !!data.final);
  $('dTitle').textContent = d.title; $('dRole').textContent = data.username;
  $('dCards').innerHTML = '';
  for (const c of d.cards) {
    const el = document.createElement('div'); el.className = 'card' + (c.locked ? ' lock' : '');
    el.innerHTML = '<small></small><b></b>';
    el.querySelector('small').textContent = (c.locked ? '🔒 ' : '') + c.label;
    el.querySelector('b').textContent = c.value;
    $('dCards').appendChild(el);
  }
  $('dClue').textContent = d.clue;
  $('login').style.display = 'none'; $('dash').style.display = 'block'; $('err').textContent = '';
  // Open the contact this login just unlocked, ready for when the player goes back.
  const next = game && game.contacts.find(c => c.number === data.level + 1);
  if (next && !next.unlocked && !busy) { current = next.number; setFile(null); }
  refresh();
}
function logout() {
  $('dash').style.display = 'none'; $('login').style.display = 'block';
  $('user').value = ''; $('pass').value = ''; $('err').textContent = '';
}
$('enter').onclick = doLogin;
$('pass').onkeydown = $('user').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) doLogin(); };
$('logout').onclick = logout;

refresh();
</script>
</body>
</html>
